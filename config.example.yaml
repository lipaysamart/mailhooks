accounts:
  - name: "personal"
    host: "imap.example.com"
    port: 993
    tls: true
    username: "user@example.com"
    password: "your-password"
    address: "user@example.com"
    webhook_url: "https://hooks.example.com/email"
    webhook_timeout: "30s"
    sync_interval: "60s"
    include_attachment_content: false

queue:
  poll_interval: "5s"
  max_retries: 3
  retry_delay: "30s"
  expire_after: "24h"
  cleanup_interval: "5m"

log:
  level: "info"
  format: "console"
